{% extends "base.html" %}

{% block title %}Register - ResQNet{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h1 id="register_title">Create Account</h1>
            <p id="register_subtitle">Join ResQNet to report incidents and help your community</p>
        </div>
        
        <form method="POST" class="auth-form">
            <div class="form-group">
                <label for="name" id="register_name_label">Name *</label>
                <input type="text" id="name" name="name" required>
            </div>
            
            <div class="form-group">
                <label for="email" id="register_email_label">Email Address *</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="password" id="register_password_label">Password *</label>
                <input type="password" id="password" name="password" required minlength="6">
            </div>

            <div class="form-group">
                <label for="confirm_password" id="register_confirm_password_label">Confirm Password *</label>
                <input type="password" id="confirm_password" name="confirm_password" required minlength="6">
            </div>

            <div class="form-group">
                <label for="preferred_language" id="register_preferred_language_label">Select Language</label>
                <select id="preferred_language" name="preferred_language">
                    <option value="en">English</option>
                    <option value="hi">हिंदी</option>
                </select>
            </div>
            
            <button type="submit" class="btn btn-primary" id="register_submit_btn">Create Account</button>
        </form>
        
        <div class="auth-footer">
            <p id="register_login_text">Already have an account? <a href="{{ url_for('login') }}" id="register_login_link">Login here</a></p>
        </div>
    </div>
</div>
{% endblock %}
