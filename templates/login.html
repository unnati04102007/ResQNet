{% extends "base.html" %}

{% block title %}Login - ResQNet{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h1 id="login_title" data-translate="login_title">Welcome Back</h1>
            <p id="login_subtitle" data-translate="login_subtitle">Login to your ResQNet account</p>
        </div>
        
        <form method="POST" class="auth-form">
            <input type="hidden" name="next" value="{{ next_url or '' }}">
            <div class="form-group">
                <label for="email" id="login_email_label" data-translate="login_email_label">Email Address *</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="password" id="login_password_label" data-translate="login_password_label">Password *</label>
                <input type="password" id="password" name="password" required>
            </div>
            
            <button type="submit" class="btn btn-primary" id="login_submit_btn" data-translate="login_submit_btn">Login</button>
        </form>
        
        <div class="auth-footer">
            <p id="login_register_text" data-translate="login_register_text">Don't have an account? <a href="{{ url_for('register') }}" id="login_register_link" data-translate="login_register_link">Register here</a></p>
        </div>
    </div>
</div>
{% endblock %}
